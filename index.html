<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Hanzi SRS</title>

<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#b5342c" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Hanzi" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<link rel="icon" href="icons/icon-192.png" />

<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<header class="topbar">
  <h1>汉字 <span>Hanzi SRS</span></h1>
  <button class="theme-toggle" id="theme-toggle" title="Toggle light/dark" aria-label="Toggle light/dark theme">
    <svg id="theme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></svg>
  </button>
</header>

<main id="app"></main>

<nav class="tabbar" id="tabbar">
  <button data-view="home" class="tab active">Home</button>
  <button data-view="review" class="tab">Review</button>
  <button data-view="browse" class="tab">Browse</button>
  <button data-view="add" class="tab">Add</button>
</nav>

<script src="js/data.js"></script>
<script src="js/srs.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
